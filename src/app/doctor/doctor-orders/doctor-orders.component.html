<app-tg-header title="DentalFlow" [subtitle]="clinic()" />

<div class="df-content">
  <app-segmented [items]="filters" [(value)]="filter" />

  <button type="button" class="audit-link" (click)="openAuditLog()">
    <span class="audit-link__icon" aria-hidden="true">↺</span>
    <span class="audit-link__text">История действий</span>
    <span class="df-chevron" aria-hidden="true">›</span>
  </button>

  @if (state() === 'error') {
    <div class="failure">
      <p class="failure__text">Не удалось загрузить заказы.</p>
      <p class="failure__detail">{{ loadError() }}</p>
      <button type="button" class="failure__retry" (click)="reload()">Повторить</button>
    </div>
  }

  @for (order of visibleOrders(); track order.id) {
    <app-order-card [order]="order" variant="doctor" (open)="openOrder($event)" />
  } @empty {
    @if (state() === 'loading') {
      <p class="empty">Загружаем заказы…</p>
    } @else if (state() !== 'error') {
      <p class="empty">В этой вкладке пока пусто.</p>
    }
  }
</div>

<app-main-button text="Новый заказ" (pressed)="createOrder()" />
