@if (authExpired()) {
  <div class="relogin">
    <span class="relogin__text">
      Сессия Telegram устарела — закройте и откройте мини-апп заново.
    </span>
    <button type="button" class="relogin__retry" (click)="retryAuth()">Повторить</button>
  </div>
}

<div class="shell">
  <router-outlet />
</div>
