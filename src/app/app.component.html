<main>
  <header>
    @if (user()?.photo_url) {
      <img [src]="user()!.photo_url" alt="" width="64" height="64" />
    }
    <h1>Привет, {{ user()?.first_name ?? 'гость' }}!</h1>
  </header>

  <section>
    <h2>Счётчик</h2>
    <p>Значение: {{ count() }}</p>
    <button (click)="dec()">−</button>
    <button (click)="inc()">+</button>
    <button (click)="reset()">Сброс</button>
  </section>

  <section>
    <h2>Данные Telegram</h2>
    <ul>
      <li>Внутри Telegram: {{ telegram.isTelegram ? 'да' : 'нет' }}</li>
      <li>Язык: {{ user()?.language_code ?? 'нет' }}</li>
      <li>initData: {{ telegram.initData ? 'есть' : 'пусто' }}</li>
    </ul>
  </section>

  <section>
    <button (click)="telegram.haptic('medium')">Вибрация</button>
    <button (click)="telegram.tg?.close()">Закрыть</button>
  </section>
</main>

<div [tgMainButton]="'Отправить (' + count() + ')'" (pressed)="submit()"></div>
