@if (authExpired()) {
  <div class="relogin">
    <span class="relogin__text">
      Сессия Telegram устарела — закройте и откройте мини-апп заново.
    </span>
    <button type="button" class="relogin__retry" (click)="retryAuth()">Повторить</button>
  </div>
}

@if (hasRole()) {
  <div class="role-bar">
    <span class="role-bar__text">Роль: {{ roleLabel() }}</span>
    <button type="button" class="role-bar__reset" [disabled]="resetting()" (click)="resetRole()">
      {{ resetting() ? 'Сбрасываем…' : 'Сбросить роль' }}
    </button>
  </div>
}

<div class="shell">
  <router-outlet />
</div>
