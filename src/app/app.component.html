@if (authExpired()) {
  <div class="relogin">
    <span class="relogin__text">
      Сессия Telegram устарела — закройте и откройте мини-апп заново.
    </span>
    <button type="button" class="relogin__retry" (click)="retryAuth()">Повторить</button>
  </div>
}

@if (showActingBar()) {
  <div class="acting">
    <button type="button" class="acting__label" (click)="openPicker()">Админ</button>
    <span class="acting__text">смотрю как {{ actingName() }}</span>
    <button type="button" class="acting__exit" (click)="stopActing()">Выйти</button>
  </div>
}

<div class="shell">
  <router-outlet />
</div>
