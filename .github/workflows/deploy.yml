name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /Mark1/
      - run: touch dist/Mark1/browser/.nojekyll
      # У Pages нет SPA-фолбэка: прямой заход на /Mark1/role ищет такой файл
      # и не находит. 404.html — копия index.html, поэтому приложение всё же
      # стартует и роутер разбирает адрес сам.
      - run: cp dist/Mark1/browser/index.html dist/Mark1/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/Mark1/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
